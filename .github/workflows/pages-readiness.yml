name: Pages readiness (read only)
on:
  page_build:
  deployment_status:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA already deployed from main
        required: true
        type: string
permissions:
  contents: read
  pages: read
  deployments: read
concurrency:
  group: pages-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Pages readiness
    if: >-
      github.repository == 'k-yuhi-commits/rika-tan' &&
      github.event.repository.private == false && github.event.repository.visibility == 'public' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'page_build' && github.event.build.status == 'built') ||
       (github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'github-pages'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify source, deployment, public URL and exact HTML
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/prepare_pages_smoke.py --output "$RUNNER_TEMP/rika-pages"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      # This step has no GITHUB_TOKEN environment binding.
      - run: python scripts/pages_smoke.py --directory "$RUNNER_TEMP/rika-pages"
