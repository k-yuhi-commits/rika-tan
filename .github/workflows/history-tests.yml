name: Learning history regression tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  history:
    name: Quality gate
    # Standard Linux runner only. Public repositories use free standard Actions.
    # Never run on a paid private-repository allowance or a larger runner.
    if: github.repository == 'k-yuhi-commits/rika-tan' && github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Classify changes (never grants merge permission)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/automation_policy.py --base "$BASE_SHA" --head "$HEAD_SHA" > change-policy.json
      - name: Report policy
        if: github.event_name == 'pull_request'
        run: |
          echo '### Change policy — automatic merging remains STOPPED' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat change-policy.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/quality_gate.py
